<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>极速判色</title>
<style>
  :root {
    --bg: #161A26;
    --bg-soft: #1F2433;
    --ink: #EDEFF6;
    --ink-dim: #8A90A6;
    --line: #2C3245;
    --good: #73D13D;
    --bad: #FF4D4F;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }
  #app {
    height: 100%;
    display: flex;
    flex-direction: column;
    max-width: 520px;
    margin: 0 auto;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }

  /* ===== 顶部状态栏 ===== */
  #hud {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 18px 22px 8px;
  }
  .hud-item { text-align: center; }
  .hud-label {
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--ink-dim);
    margin-bottom: 2px;
  }
  .hud-value {
    font-size: 26px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum";
  }
  #combo-value { color: var(--good); }

  /* ===== 计时条 ===== */
  #timer-wrap {
    height: 6px;
    margin: 10px 22px 0;
    background: var(--line);
    border-radius: 3px;
    overflow: hidden;
  }
  #timer-bar {
    height: 100%;
    width: 100%;
    border-radius: 3px;
    background: var(--ink);
    transform-origin: left center;
  }

  /* ===== 题目区 ===== */
  #stage {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  #word {
    font-size: min(42vw, 200px);
    font-weight: 900;
    line-height: 1;
    animation: pop .12s ease-out;
  }
  @keyframes pop {
    from { transform: scale(.7); opacity: .3; }
    to   { transform: scale(1); opacity: 1; }
  }
  #hint {
    margin-top: 18px;
    font-size: 13px;
    color: var(--ink-dim);
    letter-spacing: 1px;
  }

  /* ===== 答题按钮 ===== */
  #answers {
    display: flex;
    gap: 12px;
    padding: 0 16px calc(20px + env(safe-area-inset-bottom));
  }
  .btn-answer {
    flex: 1;
    height: 21vh;
    max-height: 170px;
    border: 1px solid var(--line);
    border-radius: 18px;
    background: var(--bg-soft);
    color: var(--ink);
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .btn-answer small {
    font-size: 12px;
    font-weight: 400;
    letter-spacing: 1px;
    color: var(--ink-dim);
  }
  .btn-answer:active { background: #283048; transform: scale(.97); }

  /* ===== 覆盖层（开始 / 结束）===== */
  .overlay {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px;
    text-align: center;
    z-index: 10;
  }
  .overlay.hidden { display: none; }
  .title {
    font-size: 44px;
    font-weight: 900;
    letter-spacing: 6px;
    margin-bottom: 6px;
  }
  .title .c1{color:#FF4D4F}.title .c2{color:#FFC53D}.title .c3{color:#40A9FF}.title .c4{color:#73D13D}
  .subtitle { color: var(--ink-dim); font-size: 14px; line-height: 1.9; margin: 18px 0 36px; }
  .subtitle b { color: var(--ink); font-weight: 700; }
  .btn-main {
    width: 230px;
    padding: 17px 0;
    border: none;
    border-radius: 999px;
    background: var(--ink);
    color: var(--bg);
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 6px;
  }
  .btn-main:active { transform: scale(.96); }

  /* 结束画面 */
  #over-reason {
    font-size: 14px;
    letter-spacing: 3px;
    color: var(--bad);
    margin-bottom: 14px;
  }
  #over-score {
    font-size: 78px;
    font-weight: 900;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  #over-detail {
    color: var(--ink-dim);
    font-size: 14px;
    margin: 16px 0 8px;
    line-height: 1.8;
  }
  #new-best {
    color: var(--good);
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 2px;
    height: 22px;
    margin-bottom: 22px;
  }

  /* 答错闪屏 */
  #flash {
    position: fixed;
    inset: 0;
    background: var(--bad);
    opacity: 0;
    pointer-events: none;
    z-index: 5;
  }
  #flash.on { animation: flash .35s ease-out; }
  @keyframes flash { 0%{opacity:.55} 100%{opacity:0} }

  @media (prefers-reduced-motion: reduce) {
    #word { animation: none; }
    #flash.on { animation: none; opacity: 0; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="hud-item"><div class="hud-label">得分</div><div class="hud-value" id="score-value">0</div></div>
    <div class="hud-item"><div class="hud-label">连对</div><div class="hud-value" id="combo-value">0</div></div>
    <div class="hud-item"><div class="hud-label">最高</div><div class="hud-value" id="best-value">0</div></div>
  </div>
  <div id="timer-wrap"><div id="timer-bar"></div></div>
  <div id="stage">
    <div id="word">红</div>
    <div id="hint">字义 和 颜色 是否一致？</div>
  </div>
  <div id="answers">
    <button class="btn-answer" id="btn-no">不一致<small>字义 ≠ 颜色</small></button>
    <button class="btn-answer" id="btn-yes">一致<small>字义 = 颜色</small></button>
  </div>
</div>

<div id="flash"></div>

<div class="overlay" id="start-screen">
  <div class="title"><span class="c1">极</span><span class="c2">速</span><span class="c3">判</span><span class="c4">色</span></div>
  <div class="subtitle">
    判断屏幕上的字：<b>字的含义</b>和<b>字的颜色</b>是否一致<br>
    比如蓝色的「红」字 → 不一致<br>
    越答越快，<b>答错或超时直接结束</b>
  </div>
  <button class="btn-main" id="btn-start">开始</button>
</div>

<div class="overlay hidden" id="over-screen">
  <div id="over-reason">答错了</div>
  <div id="over-score">0</div>
  <div id="over-detail">答对 0 题 · 最快反应 -</div>
  <div id="new-best"></div>
  <button class="btn-main" id="btn-retry">再来一局</button>
</div>

<script>
(function () {
  var COLORS = [
    { name: '红', hex: '#FF4D4F' },
    { name: '黄', hex: '#FFC53D' },
    { name: '蓝', hex: '#40A9FF' },
    { name: '绿', hex: '#73D13D' },
    { name: '紫', hex: '#B37FEB' }
  ];
  var START_WINDOW = 2000;  // 首题时限 ms
  var MIN_WINDOW = 700;     // 时限下限 ms
  var SHRINK = 0.965;       // 每答对一题时限缩短系数

  var state = {
    playing: false,
    score: 0, combo: 0, correctCount: 0, best: 0,
    isMatch: false,
    window: START_WINDOW,
    deadline: 0, questionStart: 0,
    fastest: Infinity,
    rafId: 0
  };

  var $ = function (id) { return document.getElementById(id); };
  var wordEl = $('word'), barEl = $('timer-bar');

  /* ---- 简易音效（首次点击后才创建，符合微信音频策略） ---- */
  var audioCtx = null;
  function beep(freq, dur, type) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type || 'sine';
      o.frequency.value = freq;
      g.gain.setValueAtTime(0.12, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + dur);
    } catch (e) {}
  }

  function nextQuestion() {
    var wordIdx = Math.floor(Math.random() * COLORS.length);
    var inkIdx;
    state.isMatch = Math.random() < 0.5;
    if (state.isMatch) {
      inkIdx = wordIdx;
    } else {
      inkIdx = Math.floor(Math.random() * (COLORS.length - 1));
      if (inkIdx >= wordIdx) inkIdx++;
    }
    wordEl.textContent = COLORS[wordIdx].name;
    wordEl.style.color = COLORS[inkIdx].hex;
    wordEl.style.animation = 'none';
    void wordEl.offsetWidth; // 重置入场动画
    wordEl.style.animation = '';

    state.questionStart = performance.now();
    state.deadline = state.questionStart + state.window;
  }

  function tick(now) {
    if (!state.playing) return;
    var left = state.deadline - now;
    if (left <= 0) { gameOver('超时'); return; }
    barEl.style.transform = 'scaleX(' + (left / state.window) + ')';
    barEl.style.background = left / state.window < 0.3 ? 'var(--bad)' : 'var(--ink)';
    state.rafId = requestAnimationFrame(tick);
  }

  function answer(guessMatch) {
    if (!state.playing) return;
    var reaction = performance.now() - state.questionStart;
    if (guessMatch === state.isMatch) {
      state.correctCount++;
      state.combo++;
      if (reaction < state.fastest) state.fastest = reaction;
      var timeBonus = Math.round(((state.deadline - performance.now()) / state.window) * 50);
      state.score += 100 + Math.max(0, timeBonus);
      state.window = Math.max(MIN_WINDOW, state.window * SHRINK);
      beep(700 + Math.min(state.combo, 20) * 25, 0.08, 'sine');
      updateHud();
      nextQuestion();
    } else {
      gameOver('答错了');
    }
  }

  function updateHud() {
    $('score-value').textContent = state.score;
    $('combo-value').textContent = state.combo;
    $('best-value').textContent = state.best;
  }

  function startGame() {
    state.playing = true;
    state.score = 0; state.combo = 0; state.correctCount = 0;
    state.window = START_WINDOW;
    state.fastest = Infinity;
    updateHud();
    $('start-screen').classList.add('hidden');
    $('over-screen').classList.add('hidden');
    beep(520, 0.1, 'triangle');
    nextQuestion();
    cancelAnimationFrame(state.rafId);
    state.rafId = requestAnimationFrame(tick);
  }

  function gameOver(reason) {
    state.playing = false;
    cancelAnimationFrame(state.rafId);
    beep(160, 0.3, 'sawtooth');
    if (navigator.vibrate) navigator.vibrate(120);
    var flash = $('flash');
    flash.classList.remove('on');
    void flash.offsetWidth;
    flash.classList.add('on');

    var isBest = state.score > state.best && state.score > 0;
    if (isBest) state.best = state.score;

    $('over-reason').textContent = reason;
    $('over-score').textContent = state.score;
    $('over-detail').textContent = '答对 ' + state.correctCount + ' 题 · 最快反应 ' +
      (state.fastest === Infinity ? '-' : Math.round(state.fastest) + 'ms');
    $('new-best').textContent = isBest ? '★ 新纪录' : '';
    updateHud();

    setTimeout(function () { $('over-screen').classList.remove('hidden'); }, 380);
  }

  /* ---- 事件绑定：pointerdown 比 click 响应快 ---- */
  function bindTap(el, fn) {
    el.addEventListener('pointerdown', function (e) { e.preventDefault(); fn(); });
  }
  bindTap($('btn-yes'), function () { answer(true); });
  bindTap($('btn-no'), function () { answer(false); });
  bindTap($('btn-start'), startGame);
  bindTap($('btn-retry'), startGame);

  // 桌面调试：← 不一致，→ 一致
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight') answer(true);
    if (e.key === 'ArrowLeft') answer(false);
    if (e.key === 'Enter' && !state.playing) startGame();
  });

  // 阻止微信里的双击缩放 / 滚动橡皮筋
  document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
})();
</script>
</body>
</html>
