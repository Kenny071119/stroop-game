<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>极速判色</title>
<style>
  :root {
    --bg: #161A26;
    --bg-soft: #1F2433;
    --ink: #EDEFF6;
    --ink-dim: #8A90A6;
    --line: #2C3245;
    --good: #73D13D;
    --bad: #FF4D4F;
    --gold: #FFC53D;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
    transition: background-color .25s ease;
  }
  #app {
    height: 100%;
    display: flex;
    flex-direction: column;
    max-width: 520px;
    margin: 0 auto;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }

  /* ===== 顶部状态栏 ===== */
  #hud {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 18px 22px 8px;
  }
  .hud-item { text-align: center; }
  .hud-label {
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--ink-dim);
    margin-bottom: 2px;
  }
  .hud-value {
    font-size: 26px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum";
  }
  #combo-value { color: var(--good); }

  /* ===== 计时条 ===== */
  #timer-wrap {
    height: 6px;
    margin: 10px 22px 0;
    background: var(--line);
    border-radius: 3px;
    overflow: hidden;
  }
  #timer-bar {
    height: 100%;
    width: 100%;
    border-radius: 3px;
    background: var(--ink);
    transform-origin: left center;
  }

  /* ===== 题目区 ===== */
  #stage {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  #word {
    font-size: min(42vw, 200px);
    font-weight: 900;
    line-height: 1;
    animation: pop .12s ease-out;
  }
  @keyframes pop {
    from { transform: scale(.7); opacity: .3; }
    to   { transform: scale(1); opacity: 1; }
  }
  #hint {
    margin-top: 18px;
    font-size: 13px;
    color: var(--ink-dim);
    letter-spacing: 1px;
  }
  #tier-toast {
    position: absolute;
    top: 12%;
    left: 0; right: 0;
    font-size: 30px;
    font-weight: 900;
    letter-spacing: 6px;
    color: var(--gold);
    opacity: 0;
    pointer-events: none;
  }
  #tier-toast.on { animation: tierpop 1.1s ease-out; }
  @keyframes tierpop {
    0% { opacity: 0; transform: scale(.6); }
    18% { opacity: 1; transform: scale(1.08); }
    30% { transform: scale(1); }
    75% { opacity: 1; }
    100% { opacity: 0; }
  }

  /* ===== 答题按钮 ===== */
  #answers {
    display: flex;
    gap: 12px;
    padding: 0 16px calc(20px + env(safe-area-inset-bottom));
  }
  .btn-answer {
    flex: 1;
    height: 21vh;
    max-height: 170px;
    border: 1px solid var(--line);
    border-radius: 18px;
    background: var(--bg-soft);
    color: var(--ink);
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .btn-answer small {
    font-size: 12px;
    font-weight: 400;
    letter-spacing: 1px;
    color: var(--ink-dim);
  }
  .btn-answer:active { background: #283048; transform: scale(.97); }

  /* ===== 覆盖层 ===== */
  .overlay {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px;
    text-align: center;
    z-index: 10;
  }
  .overlay.hidden { display: none; }
  .title {
    font-size: 44px;
    font-weight: 900;
    letter-spacing: 6px;
    margin-bottom: 6px;
  }
  .title .c1{color:#FF4D4F}.title .c2{color:#FFC53D}.title .c3{color:#40A9FF}.title .c4{color:#73D13D}
  .subtitle { color: var(--ink-dim); font-size: 14px; line-height: 1.9; margin: 18px 0 32px; }
  .subtitle b { color: var(--ink); font-weight: 700; }
  .btn-main {
    width: 230px;
    padding: 17px 0;
    border: none;
    border-radius: 999px;
    background: var(--ink);
    color: var(--bg);
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 6px;
  }
  .btn-main:active { transform: scale(.96); }
  .btn-ghost {
    margin-top: 14px;
    padding: 13px 34px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--bg-soft);
    color: var(--ink);
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 3px;
  }
  .btn-ghost:active { background: #283048; }

  /* 结束画面 */
  #over-reason {
    font-size: 14px;
    letter-spacing: 3px;
    color: var(--bad);
    margin-bottom: 14px;
  }
  #over-score {
    font-size: 78px;
    font-weight: 900;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  #over-detail {
    color: var(--ink-dim);
    font-size: 14px;
    margin: 16px 0 6px;
    line-height: 1.8;
  }
  #new-best {
    color: var(--good);
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 2px;
    height: 22px;
    margin-bottom: 16px;
  }
  #submit-box {
    display: flex;
    gap: 10px;
    margin-bottom: 18px;
  }
  #my-name {
    width: 130px;
    padding: 13px 14px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--bg-soft);
    color: var(--ink);
    font-size: 14px;
    text-align: center;
    outline: none;
  }
  #btn-submit {
    padding: 13px 24px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--bg-soft);
    color: var(--ink);
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 2px;
  }
  #btn-submit:active { background: #283048; }
  #btn-submit:disabled { opacity: .45; }
  #submit-tip {
    font-size: 12px;
    color: var(--ink-dim);
    height: 18px;
    margin-bottom: 4px;
  }

  /* ===== 排行榜 ===== */
  #board-screen { justify-content: flex-start; padding-top: max(40px, env(safe-area-inset-top)); }
  #board-title {
    font-size: 26px;
    font-weight: 900;
    letter-spacing: 5px;
    margin-bottom: 18px;
  }
  #board-list {
    width: 100%;
    max-width: 440px;
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    border-top: 1px solid var(--line);
  }
  .row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 13px 10px;
    border-bottom: 1px solid var(--line);
    font-size: 15px;
  }
  .row .rank {
    width: 34px;
    text-align: center;
    font-weight: 900;
    font-variant-numeric: tabular-nums;
    color: var(--ink-dim);
  }
  .row.top1 .rank { color: var(--gold); }
  .row.top2 .rank { color: #D8DCE8; }
  .row.top3 .rank { color: #D49A6A; }
  .row .nm {
    flex: 1;
    text-align: left;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .row .sc {
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .row.me { background: rgba(115, 209, 61, .08); }
  .row.me .nm { color: var(--good); }
  #board-status {
    padding: 28px 0;
    color: var(--ink-dim);
    font-size: 14px;
  }
  #board-close { margin: 16px 0 calc(8px + env(safe-area-inset-bottom)); }

  /* 答错闪屏 */
  #flash {
    position: fixed;
    inset: 0;
    background: var(--bad);
    opacity: 0;
    pointer-events: none;
    z-index: 5;
  }
  #flash.on { animation: flash .35s ease-out; }
  @keyframes flash { 0%{opacity:.55} 100%{opacity:0} }

  @media (prefers-reduced-motion: reduce) {
    #word { animation: none; }
    #flash.on { animation: none; opacity: 0; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="hud-item"><div class="hud-label">得分</div><div class="hud-value" id="score-value">0</div></div>
    <div class="hud-item"><div class="hud-label">连对</div><div class="hud-value" id="combo-value">0</div></div>
    <div class="hud-item"><div class="hud-label">最高</div><div class="hud-value" id="best-value">0</div></div>
  </div>
  <div id="timer-wrap"><div id="timer-bar"></div></div>
  <div id="stage">
    <div id="tier-toast"></div>
    <div id="word">红</div>
    <div id="hint">字义 和 颜色 是否一致？</div>
  </div>
  <div id="answers">
    <button class="btn-answer" id="btn-no">不一致<small>字义 ≠ 颜色</small></button>
    <button class="btn-answer" id="btn-yes">一致<small>字义 = 颜色</small></button>
  </div>
</div>

<div style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true"><img src="share-icon.png" width="300" height="300" alt=""></div>

<div id="flash"></div>

<div class="overlay" id="start-screen">
  <div class="title"><span class="c1">极</span><span class="c2">速</span><span class="c3">判</span><span class="c4">色</span></div>
  <div class="subtitle">
    判断屏幕上的字：<b>字的含义</b>和<b>字的颜色</b>是否一致<br>
    比如蓝色的「红」字 → 不一致<br>
    越答越快，<b>答错或超时直接结束</b><br>
    每答对 10 题升一档，<b>第 3 档起背景开始捣乱</b>
  </div>
  <button class="btn-main" id="btn-start">开始</button>
  <button class="btn-ghost" id="btn-board-1">🏆 排行榜</button>
</div>

<div class="overlay hidden" id="over-screen">
  <div id="over-reason">答错了</div>
  <div id="over-score">0</div>
  <div id="over-detail">答对 0 题 · 最快反应 -</div>
  <div id="new-best"></div>
  <div id="submit-box">
    <input id="my-name" maxlength="8" placeholder="你的昵称">
    <button id="btn-submit">上传成绩</button>
  </div>
  <div id="submit-tip"></div>
  <button class="btn-main" id="btn-retry">再来一局</button>
  <button class="btn-ghost" id="btn-board-2">🏆 排行榜</button>
</div>

<div class="overlay hidden" id="board-screen">
  <div id="board-title">🏆 排行榜</div>
  <div id="board-list"><div id="board-status">加载中…</div></div>
  <button class="btn-main" id="board-close">返 回</button>
</div>

<script>
(function () {
  /* ===== Supabase 配置 ===== */
  var SB_URL = 'https://ujmnrxdkrcaayjsyvmky.supabase.co';
  var SB_KEY = 'sb_publishable_Ow1k72dOhUT6NO8aTwfLkw_f0bnjzMH';
  var SB_HEADERS = {
    'apikey': SB_KEY,
    'Authorization': 'Bearer ' + SB_KEY,
    'Content-Type': 'application/json'
  };

  var COLORS = [
    { name: '红', hex: '#FF4D4F' },
    { name: '黄', hex: '#FFC53D' },
    { name: '蓝', hex: '#40A9FF' },
    { name: '绿', hex: '#73D13D' },
    { name: '紫', hex: '#B37FEB' }
  ];
  var START_WINDOW = 2000;
  /* 档位表：minQ=触发题数, shrink=每题缩时, floor=时限下限ms, bg=背景干扰概率 */
  var TIERS = [
    { minQ: 0,  shrink: 0.97, floor: 1000, bg: 0   },
    { minQ: 10, shrink: 0.95, floor: 800,  bg: 0   },
    { minQ: 20, shrink: 0.94, floor: 650,  bg: 0.5 },
    { minQ: 30, shrink: 0.93, floor: 550,  bg: 0.8 }
  ];
  /* 五种题色的压暗背景变体（混入 18% 题色，保证字色对比度） */
  var BG_TINTS = ['#40232D', '#40392A', '#1E344D', '#273B2A', '#322C49'];
  function tierIndex(correct) {
    var t = 0;
    for (var i = 0; i < TIERS.length; i++) if (correct >= TIERS[i].minQ) t = i;
    return t;
  }

  var state = {
    playing: false,
    score: 0, combo: 0, correctCount: 0, best: 0,
    isMatch: false,
    window: START_WINDOW,
    deadline: 0, questionStart: 0,
    fastest: Infinity,
    rafId: 0,
    submitted: false,
    myName: '',
    tier: 0, maxTier: 0
  };

  var $ = function (id) { return document.getElementById(id); };
  var wordEl = $('word'), barEl = $('timer-bar');

  /* ---- 音效 ---- */
  var audioCtx = null;
  function beep(freq, dur, type) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type || 'sine';
      o.frequency.value = freq;
      g.gain.setValueAtTime(0.12, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + dur);
    } catch (e) {}
  }

  function nextQuestion() {
    var wordIdx = Math.floor(Math.random() * COLORS.length);
    var inkIdx;
    state.isMatch = Math.random() < 0.5;
    if (state.isMatch) {
      inkIdx = wordIdx;
    } else {
      inkIdx = Math.floor(Math.random() * (COLORS.length - 1));
      if (inkIdx >= wordIdx) inkIdx++;
    }
    wordEl.textContent = COLORS[wordIdx].name;
    wordEl.style.color = COLORS[inkIdx].hex;
    wordEl.style.animation = 'none';
    void wordEl.offsetWidth;
    wordEl.style.animation = '';

    /* 背景干扰：高档位按概率把背景染成第三种颜色的暗变体 */
    var t = TIERS[state.tier];
    if (t.bg > 0 && Math.random() < t.bg) {
      var bgIdx = Math.floor(Math.random() * BG_TINTS.length);
      document.body.style.backgroundColor = BG_TINTS[bgIdx];
    } else {
      document.body.style.backgroundColor = '';
    }

    state.questionStart = performance.now();
    state.deadline = state.questionStart + state.window;
  }

  function tick(now) {
    if (!state.playing) return;
    var left = state.deadline - now;
    if (left <= 0) { gameOver('超时'); return; }
    barEl.style.transform = 'scaleX(' + (left / state.window) + ')';
    barEl.style.background = left / state.window < 0.3 ? 'var(--bad)' : 'var(--ink)';
    state.rafId = requestAnimationFrame(tick);
  }

  function answer(guessMatch) {
    if (!state.playing) return;
    var reaction = performance.now() - state.questionStart;
    if (guessMatch === state.isMatch) {
      state.correctCount++;
      state.combo++;
      if (reaction < state.fastest) state.fastest = reaction;
      var timeBonus = Math.round(((state.deadline - performance.now()) / state.window) * 50);
      state.score += 100 + Math.max(0, timeBonus);

      /* 档位推进 */
      var newTier = tierIndex(state.correctCount);
      if (newTier > state.tier) {
        state.tier = newTier;
        if (newTier > state.maxTier) state.maxTier = newTier;
        var toast = $('tier-toast');
        toast.textContent = '⚡ 第 ' + (newTier + 1) + ' 档';
        toast.classList.remove('on');
        void toast.offsetWidth;
        toast.classList.add('on');
        $('hint').textContent = '第 ' + (newTier + 1) + ' 档 · ' +
          (TIERS[newTier].bg > 0 ? '背景干扰中' : '提速');
        beep(900 + newTier * 120, 0.18, 'triangle');
      }
      var tp = TIERS[state.tier];
      state.window = Math.max(tp.floor, state.window * tp.shrink);
      beep(700 + Math.min(state.combo, 20) * 25, 0.08, 'sine');
      updateHud();
      nextQuestion();
    } else {
      gameOver('答错了');
    }
  }

  function updateHud() {
    $('score-value').textContent = state.score;
    $('combo-value').textContent = state.combo;
    $('best-value').textContent = state.best;
  }

  function startGame() {
    state.playing = true;
    state.score = 0; state.combo = 0; state.correctCount = 0;
    state.window = START_WINDOW;
    state.fastest = Infinity;
    state.submitted = false;
    state.tier = 0; state.maxTier = 0;
    document.body.style.backgroundColor = '';
    $('hint').textContent = '字义 和 颜色 是否一致？';
    updateHud();
    $('start-screen').classList.add('hidden');
    $('over-screen').classList.add('hidden');
    $('board-screen').classList.add('hidden');
    beep(520, 0.1, 'triangle');
    nextQuestion();
    cancelAnimationFrame(state.rafId);
    state.rafId = requestAnimationFrame(tick);
  }

  function gameOver(reason) {
    state.playing = false;
    cancelAnimationFrame(state.rafId);
    document.body.style.backgroundColor = '';
    beep(160, 0.3, 'sawtooth');
    if (navigator.vibrate) navigator.vibrate(120);
    var flash = $('flash');
    flash.classList.remove('on');
    void flash.offsetWidth;
    flash.classList.add('on');

    var isBest = state.score > state.best && state.score > 0;
    if (isBest) state.best = state.score;

    $('over-reason').textContent = reason;
    $('over-score').textContent = state.score;
    $('over-detail').textContent = '答对 ' + state.correctCount + ' 题 · 到达第 ' + (state.maxTier + 1) + ' 档 · 最快 ' +
      (state.fastest === Infinity ? '-' : Math.round(state.fastest) + 'ms');
    $('new-best').textContent = isBest ? '★ 新纪录' : '';
    $('submit-tip').textContent = '';
    $('btn-submit').disabled = false;
    $('btn-submit').textContent = '上传成绩';
    $('my-name').value = state.myName;
    updateHud();

    setTimeout(function () { $('over-screen').classList.remove('hidden'); }, 380);
  }

  /* ===== 排行榜 ===== */
  function submitScore() {
    if (state.submitted) return;
    var name = $('my-name').value.trim().slice(0, 8);
    var tip = $('submit-tip');
    if (!name) { tip.textContent = '先填个昵称'; return; }
    if (state.score <= 0) { tip.textContent = '0 分就不上榜了吧'; return; }
    state.myName = name;
    var btn = $('btn-submit');
    btn.disabled = true;
    btn.textContent = '上传中…';
    fetch(SB_URL + '/rest/v1/scores', {
      method: 'POST',
      headers: SB_HEADERS,
      body: JSON.stringify({ name: name, score: state.score })
    }).then(function (res) {
      if (res.ok) {
        state.submitted = true;
        btn.textContent = '已上传';
        tip.textContent = '✓ 成绩已上榜';
        openBoard();
      } else {
        btn.disabled = false;
        btn.textContent = '上传成绩';
        tip.textContent = '上传失败，再试一次';
      }
    }).catch(function () {
      btn.disabled = false;
      btn.textContent = '上传成绩';
      tip.textContent = '网络不通，稍后再试';
    });
  }

  function openBoard() {
    $('board-screen').classList.remove('hidden');
    var list = $('board-list');
    list.innerHTML = '<div id="board-status">加载中…</div>';
    fetch(SB_URL + '/rest/v1/scores?select=name,score&order=score.desc&limit=200', {
      headers: SB_HEADERS
    }).then(function (res) { return res.json(); }).then(function (rows) {
      // 同名去重，保留最高分
      var bestByName = {};
      rows.forEach(function (r) {
        if (!(r.name in bestByName) || r.score > bestByName[r.name]) bestByName[r.name] = r.score;
      });
      var ranked = Object.keys(bestByName).map(function (n) {
        return { name: n, score: bestByName[n] };
      }).sort(function (a, b) { return b.score - a.score; }).slice(0, 50);

      if (!ranked.length) {
        list.innerHTML = '<div id="board-status">还没有人上榜，抢个第一？</div>';
        return;
      }
      var html = '';
      ranked.forEach(function (r, i) {
        var cls = 'row' + (i < 3 ? ' top' + (i + 1) : '') +
          (r.name === state.myName ? ' me' : '');
        html += '<div class="' + cls + '">' +
          '<div class="rank">' + (i + 1) + '</div>' +
          '<div class="nm"></div>' +
          '<div class="sc">' + r.score + '</div></div>';
      });
      list.innerHTML = html;
      // 昵称用 textContent 注入，防止注入攻击
      var nms = list.querySelectorAll('.nm');
      ranked.forEach(function (r, i) { nms[i].textContent = r.name; });
    }).catch(function () {
      list.innerHTML = '<div id="board-status">加载失败，检查网络后重试</div>';
    });
  }

  /* ---- 事件绑定 ---- */
  function bindTap(el, fn) {
    el.addEventListener('pointerdown', function (e) { e.preventDefault(); fn(); });
  }
  bindTap($('btn-yes'), function () { answer(true); });
  bindTap($('btn-no'), function () { answer(false); });
  bindTap($('btn-start'), startGame);
  bindTap($('btn-retry'), startGame);
  bindTap($('board-close'), function () { $('board-screen').classList.add('hidden'); });
  $('btn-board-1').addEventListener('click', openBoard);
  $('btn-board-2').addEventListener('click', openBoard);
  $('btn-submit').addEventListener('click', submitScore);

  document.addEventListener('keydown', function (e) {
    if (e.target.tagName === 'INPUT') return;
    if (e.key === 'ArrowRight') answer(true);
    if (e.key === 'ArrowLeft') answer(false);
    if (e.key === 'Enter' && !state.playing) startGame();
  });

  // 阻止微信下拉橡皮筋，但放行排行榜内部滚动
  document.addEventListener('touchmove', function (e) {
    if (e.target.closest && e.target.closest('#board-list')) return;
    e.preventDefault();
  }, { passive: false });
})();
</script>
</body>
</html>
